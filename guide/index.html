<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNOW WAY | 滑雪行前小幫手</title>
<meta name="description" content="回答幾個小問題，拿到你的專屬滑雪行前清單：去哪滑、怎麼去、要帶什麼、上什麼課。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cr:#FBF6E3;      /* 奶油底 */
  --cr2:#F5EDCC;
  --card:#FFFDF6;
  --ln:#E8E2C8;
  --ik:#3A2E1A;      /* 文字 */
  --mu:#8A7A58;      /* 次要文字 */
  --gd:#C8820A;      /* 金色 */
  --gd2:#E2A830;
  --gdbg:#FCEFD8;
  --rd:#9B3A2A;
  --gn:#4E7A3A;
  --gnbg:#EAF1DF;
  --bl:#2F6A8A;
  --blbg:#E3EEF3;
  --shadow:0 2px 10px rgba(58,46,26,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cr);color:var(--ik);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;line-height:1.65;font-size:15px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:var(--gd)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}

/* 頂部 */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--gd)}
.brand small{display:block;color:var(--mu);font-weight:400;letter-spacing:.04em;font-size:12px}
.link-btn{font-size:13px;color:var(--mu);text-decoration:underline;text-underline-offset:3px}

/* 首頁 */
.hero{text-align:center;padding:12px 0 22px}
.hero .flake{font-size:44px;display:inline-block;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:24px;font-weight:700;margin:8px 0 6px;letter-spacing:.04em}
.hero p{color:var(--mu);font-size:14px}
.map{position:relative;display:flex;flex-direction:column;gap:12px;margin:8px 0 18px}
.map::before{content:"";position:absolute;left:31px;top:30px;bottom:30px;border-left:2px dashed var(--ln)}
.stage{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.stage:active{transform:scale(.98)}
.stage .ic{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--cr2);position:relative;z-index:1}
.stage.done .ic{background:var(--gd);box-shadow:0 0 0 4px var(--gdbg)}
.stage .tx{flex:1}
.stage .tx b{display:block;font-size:15px}
.stage .tx span{font-size:12.5px;color:var(--mu)}
.stage .st{font-size:12px;color:var(--mu);white-space:nowrap}
.stage.done .st{color:var(--gd);font-weight:500}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:500;text-align:center;text-decoration:none}
.btn-gd{background:var(--gd);color:#fff;box-shadow:0 3px 0 #9E6608}
.btn-gd:active{transform:translateY(2px);box-shadow:0 1px 0 #9E6608}
.btn-ol{border:1.5px solid var(--gd);color:var(--gd);background:transparent}
.btn-ln{background:#06C755;color:#fff;box-shadow:0 3px 0 #04913E}
.btn:disabled{opacity:.4;cursor:default}
.gap{height:10px}
.note{font-size:12.5px;color:var(--mu);text-align:center;margin-top:12px}

/* 問答 */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.prog .bar{flex:1;height:8px;background:var(--cr2);border-radius:8px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gd2),var(--gd));border-radius:8px;transition:width .35s}
.prog .lbl{font-size:12px;color:var(--mu);white-space:nowrap}
.chap-tag{display:inline-block;font-size:12px;color:var(--gd);background:var(--gdbg);padding:3px 10px;border-radius:20px;margin-bottom:10px;font-weight:500}
.q{font-size:20px;font-weight:700;margin-bottom:6px;line-height:1.45}
.q-sub{font-size:13.5px;color:var(--mu);margin-bottom:16px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:13px 14px;font-size:15px;transition:all .15s;animation:pop .3s both}
.opt .e{font-size:22px;flex:none;width:28px;text-align:center}
.opt .t b{display:block;font-weight:500}
.opt .t small{color:var(--mu);font-size:12.5px}
.opt:hover{border-color:var(--gd2)}
.opt.on{border-color:var(--gd);background:var(--gdbg)}
.opt.on::after{content:"✓";margin-left:auto;color:var(--gd);font-weight:700}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opts .opt:nth-child(2){animation-delay:.04s}.opts .opt:nth-child(3){animation-delay:.08s}.opts .opt:nth-child(4){animation-delay:.12s}.opts .opt:nth-child(5){animation-delay:.16s}.opts .opt:nth-child(6){animation-delay:.2s}.opts .opt:nth-child(7){animation-delay:.24s}.opts .opt:nth-child(8){animation-delay:.28s}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0 6px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gd);color:var(--gd);font-size:26px;background:var(--card)}
.stepper .n{font-size:40px;font-weight:700;min-width:70px;text-align:center}
.nav{display:flex;gap:10px;margin-top:22px}
.nav .back{flex:none;width:auto;padding:14px 18px}

/* 小知識卡 */
.tip-wrap{position:fixed;inset:0;background:rgba(58,46,26,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.tip{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;padding:22px 20px 26px;animation:up .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(100%)}}
.tip .h{font-size:13px;color:var(--gd);font-weight:700;letter-spacing:.06em;margin-bottom:6px}
.tip .b{font-size:15px;margin-bottom:18px}

/* 過關 */
.clear{text-align:center;padding:30px 0}
.badge{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE7A8,var(--gd2) 55%,var(--gd));display:grid;place-items:center;font-size:52px;box-shadow:0 0 0 8px var(--gdbg),0 8px 24px rgba(200,130,10,.35);animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg);opacity:0}}
.clear h2{font-size:22px;margin-bottom:4px}
.clear p{color:var(--mu);margin-bottom:22px}
.snow{position:fixed;top:-20px;color:#fff;text-shadow:0 0 3px rgba(58,46,26,.25);pointer-events:none;animation:fall linear forwards;z-index:30}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* 結果 */
.res-head{text-align:center;margin-bottom:18px}
.res-head h1{font-size:22px;margin:6px 0 4px}
.res-head p{color:var(--mu);font-size:13.5px}
.badges{display:flex;justify-content:center;gap:8px;margin-top:10px}
.badges span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--cr2);filter:grayscale(1);opacity:.45}
.badges span.got{background:var(--gdbg);filter:none;opacity:1;box-shadow:0 0 0 2px var(--gd2)}
.sec{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h3{font-size:14.5px;margin:14px 0 6px}
.sec p,.sec li{font-size:14.5px}
.sec ul{padding-left:20px}
.sec li{margin-bottom:4px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;margin:0 4px 4px 0;font-weight:500}
.p-gd{background:var(--gdbg);color:var(--gd)}
.p-rd{background:#F6E2DC;color:var(--rd)}
.p-gn{background:var(--gnbg);color:var(--gn)}
.p-bl{background:var(--blbg);color:var(--bl)}
.big-pick{display:flex;gap:12px;align-items:center;background:var(--gdbg);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.big-pick .e{font-size:32px}
.big-pick b{font-size:18px;display:block}
.big-pick small{color:var(--mu);font-size:13px}
.route{list-style:none;padding:0!important;margin:6px 0}
.route li{position:relative;padding:0 0 12px 26px;margin:0}
.route li::before{content:"";position:absolute;left:6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--gd)}
.route li::after{content:"";position:absolute;left:10px;top:18px;bottom:0;border-left:2px solid var(--ln)}
.route li:last-child::after{display:none}
.route li small{display:block;color:var(--mu);font-size:12.5px}
.chk{list-style:none;padding:0!important}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--ln);margin:0}
.chk li:last-child{border-bottom:none}
.chk input{width:20px;height:20px;accent-color:var(--gd);flex:none;margin-top:2px}
.chk label{flex:1;cursor:pointer}
.chk label b{font-weight:500}
.chk label small{display:block;color:var(--mu);font-size:12.5px}
.chk li.done label{text-decoration:line-through;color:var(--mu)}
.callout{background:var(--blbg);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.callout.warn{background:#F6E2DC}
.callout.gd{background:var(--gdbg)}
.disc{border:1.5px dashed var(--rd);color:var(--rd);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:500;margin-bottom:12px;background:#FDF3EF}
table.price{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
table.price td{padding:8px 4px;border-bottom:1px solid var(--ln);vertical-align:top}
table.price td:last-child{text-align:right;white-space:nowrap;font-weight:500}
table.price td small{display:block;color:var(--mu);font-size:12px;font-weight:400}
table.price tr.total td{border-bottom:none;border-top:2px solid var(--ik);font-size:16px;font-weight:700;padding-top:10px}
.shop{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.shop b{display:block}
.shop code{background:var(--gdbg);color:var(--gd);padding:1px 7px;border-radius:5px;font-family:inherit;font-weight:700;user-select:all}
.shop small{color:var(--mu);font-size:12.5px;display:block}
.missing{text-align:center;color:var(--mu);font-size:14px;padding:8px 0}
.missing button{color:var(--gd);text-decoration:underline;font-size:14px;margin-top:4px}
.gloss{display:grid;gap:8px;margin-top:6px}
.gloss div{background:var(--cr);border-radius:10px;padding:9px 12px;font-size:13.5px}
.gloss b{color:var(--gd)}
.foot{text-align:center;font-size:12px;color:var(--mu);margin-top:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ik);color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;z-index:40;animation:fade .2s}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   資料：關卡與題目
   每題：id、q（題目）、sub（說明）、type（single / multi / number）
   opts：{v 值, e 表情, t 文字, s 小字, tip 小知識}
   show(a)：依前面的答案決定要不要問這題
   ============================================================ */
const CHAPTERS = [
  {
    id:'place', icon:'🗺️', name:'選地點', desc:'湯澤還是藏王？什麼時候去？', badge:'雪國探險家',
    qs:[
      {id:'region', q:'你已經決定要去哪裡滑雪了嗎？', sub:'SNOW WAY 在新潟「越後湯澤」跟山形「藏王」都有教練',
        opts:[
          {v:'yuzawa',e:'🚄',t:'越後湯澤',s:'離東京最近',tip:'「湯澤」其實是一整個區域，裡面有岩原、中里、神立、苗場等好幾個雪場，車站有免費接駁巴士到各雪場！'},
          {v:'zao',e:'🌲',t:'山形藏王',s:'樹冰、溫泉街',tip:'藏王其實不只一個雪場！除了有名的「藏王溫泉滑雪場」，旁邊還有人超少、超適合新手的「藏王 Liza world」，山頂一樣看得到樹冰。'},
          {v:'unsure',e:'🤔',t:'還沒決定',s:'幫我推薦'}
        ]},
      {id:'want', q:'這趟旅行，你最想要的是？', show:a=>a.region==='unsure',
        opts:[
          {v:'ice',e:'❄️',t:'看樹冰、雪國風景',s:'拍美照最重要'},
          {v:'easy',e:'🚅',t:'交通越簡單越好',s:'不想轉很多車'},
          {v:'tour',e:'🧳',t:'有人幫我全部安排好',s:'住宿接送都不用煩惱'},
          {v:'any',e:'🙂',t:'都可以，能好好滑雪就好'}
        ]},
      {id:'tokyo', q:'行程裡會在東京玩嗎？', show:a=>a.region==='unsure',
        opts:[
          {v:'yes',e:'🗼',t:'會，滑雪只是其中幾天',tip:'從東京搭新幹線到越後湯澤只要 1 小時多，很多人是「東京玩幾天，中間去滑 1～2 天」。'},
          {v:'no',e:'⛷️',t:'不太會，主要就是滑雪'}
        ]},
      {id:'days', q:'預計要滑幾天？',
        opts:[
          {v:'1',e:'1️⃣',t:'1 天',s:'體驗看看'},
          {v:'2',e:'2️⃣',t:'2 天',tip:'第一次滑雪建議安排 2～3 天：第一天上課打基礎，第二天練習，第三天看體力決定！'},
          {v:'3',e:'3️⃣',t:'3 天'},
          {v:'4',e:'🔥',t:'4 天以上'}
        ]},
      {id:'month', q:'大概什麼時候去？',
        opts:[
          {v:'12a',e:'🍂',t:'12 月中以前',tip:'大部分雪場 12/20 左右才開！湯澤最早開的是神樂（約 11 月底～12 月初），12 月中前想滑只能去神樂。'},
          {v:'12b',e:'🎄',t:'12 月下旬'},
          {v:'1',e:'⛄',t:'1 月',tip:'小編最推 1 月！雪比 12 月穩定，人又比 2 月少。'},
          {v:'2',e:'🧧',t:'2 月',tip:'2 月是旺季，農曆年後跟 228 連假人最多，住宿要趕快訂！'},
          {v:'3',e:'🌸',t:'3 月',tip:'3 月是春雪，雪比較軟、跌倒不痛，很適合練習。不過 3 月底很多雪道可能會因為雪不夠提早關。'},
          {v:'x',e:'❔',t:'還沒決定'}
        ]},
      {id:'kids', q:'同行有小朋友要一起滑嗎？',
        opts:[
          {v:'none',e:'🧑',t:'沒有，都是大人'},
          {v:'big',e:'🧒',t:'有，8 歲以上',tip:'10 歲以上的小朋友就可以直接跟大人一起上課了！'},
          {v:'small',e:'👶',t:'有，4～7 歲',tip:'8 歲以下我們會推薦 1 對 1，因為搭纜車時教練一次只能帶一位小朋友。不過家長一起上課也可以，教練會調整方式。'},
          {v:'tiny',e:'🍼',t:'有，4 歲以下',tip:'4 歲以下通常租不到雪具，硬穿大一號的鞋子反而危險。可以帶小朋友搭觀光纜車看風景、玩雪盆就好～'}
        ]}
    ]
  },
  {
    id:'go', icon:'✈️', name:'怎麼去', desc:'機場、交通、住宿', badge:'交通達人',
    qs:[
      {id:'airport', q:'預計從哪個機場入境？',
        opts:[
          {v:'nrt',e:'🛫',t:'東京成田'},
          {v:'hnd',e:'🛬',t:'東京羽田',tip:'羽田離東京市區比較近，到東京站轉新幹線最快！'},
          {v:'sdj',e:'🌾',t:'仙台',tip:'去藏王的話，仙台機場有巴士可以直達，大約 1 個半小時。'},
          {v:'x',e:'❔',t:'還沒買機票'}
        ]},
      {id:'car', q:'會自己租車開車嗎？',
        opts:[
          {v:'no',e:'🚌',t:'不會，搭電車巴士'},
          {v:'yes',e:'🚗',t:'會租車',tip:'雪地開車一定要雪胎，山路結冰很常見。沒有雪地駕駛經驗的話，小編還是比較推薦搭大眾運輸＋接駁。'}
        ]},
      {id:'arrive', q:'第一天上課，你什麼時候到？',
        opts:[
          {v:'before',e:'🛏️',t:'前一天就到了',s:'住一晚再上課',tip:'最推薦！前一天傍晚就能先去雪具店取裝備，隔天早上就不用趕。'},
          {v:'morning',e:'⏰',t:'當天早上才過去'},
          {v:'daytrip',e:'🔁',t:'從東京當天來回',tip:'湯澤可以當天來回！日本人也很多這樣滑。藏王就比較遠，當天來回會很趕。'}
        ]},
      {id:'stay', q:'住宿訂好了嗎？',
        opts:[
          {v:'station',e:'🚉',t:'訂了，在車站附近'},
          {v:'slope',e:'🏔️',t:'訂了，在雪場旁邊'},
          {v:'city',e:'🏙️',t:'訂了，在市區（例如山形市）'},
          {v:'none',e:'📝',t:'還沒訂'}
        ]}
    ]
  },
  {
    id:'gear', icon:'🎿', name:'裝備', desc:'要買什麼？要租什麼？', badge:'裝備專家',
    qs:[
      {id:'board', q:'想學單板還是雙板？',
        opts:[
          {v:'sb',e:'🏂',t:'單板 Snowboard',s:'一塊板，側身滑'},
          {v:'ski',e:'⛷️',t:'雙板 Ski',s:'兩塊板，面向前方',tip:'雙板一開始比較不容易跌倒，上下纜車也比較簡單，小朋友跟想輕鬆體驗的人很推薦！'},
          {v:'x',e:'🤷',t:'還不知道'}
        ]},
      {id:'have', q:'你已經有哪些裝備了？', sub:'可以複選，沒有就直接按「下一步」', type:'multi',
        opts:[
          {v:'wear',e:'🧥',t:'雪衣、雪褲'},
          {v:'glove',e:'🧤',t:'滑雪手套'},
          {v:'goggle',e:'🥽',t:'雪鏡'},
          {v:'helmet',e:'⛑️',t:'安全帽'},
          {v:'pad',e:'🩳',t:'防摔褲、護膝'},
          {v:'socks',e:'🧦',t:'滑雪襪'},
          {v:'board',e:'🏂',t:'板子、雪鞋'}
        ]},
      {id:'know', q:'你對滑雪裝備了解多少？',
        opts:[
          {v:'0',e:'😵',t:'完全不懂',s:'固定器是什麼？'},
          {v:'1',e:'🙂',t:'大概知道'},
          {v:'2',e:'😎',t:'很懂，有自己的偏好'}
        ]},
      {id:'glasses', q:'平常有戴眼鏡嗎？',
        opts:[
          {v:'no',e:'👀',t:'沒有／會戴隱形眼鏡'},
          {v:'yes',e:'👓',t:'有，而且不能戴隱形',tip:'要找「可以套在眼鏡外面」的 OTG 雪鏡！雪具店租的不一定合，建議出發前先買好。'}
        ]}
    ]
  },
  {
    id:'level', icon:'🏂', name:'程度與課程', desc:'滑過幾次？想學到哪？', badge:'雪道新星',
    qs:[
      {id:'exp', q:'你滑過雪嗎？',
        opts:[
          {v:'0',e:'🐣',t:'第一次！'},

/* 找下一題（跳過不適用的題目） */
function visibleQs(ch){ return ch.qs.filter(q=>!q.show||q.show(S.a)); }

/* ============================================================
   畫面：題目
   ============================================================ */
function question(){
  const ch = CHAPTERS[run.chapters[run.ci]];
  const qs = visibleQs(ch);
  if(run.qi >= qs.length){ return chapterClear(ch); }
  const q = qs[run.qi];
  const pct = Math.round(run.qi/qs.length*100);
  const val = S.a[q.id];
  let body = '';
  if(q.type==='number'){
    const n = val || q.def;
    S.a[q.id] = n;
    body = `<div class="stepper">
        <button onclick="step(-1)" aria-label="減少">−</button>
        <span class="n" id="num">${n}</span>
        <button onclick="step(1)" aria-label="增加">＋</button></div>
      <p class="note" id="numNote">${peopleNote(n)}</p>`;
  } else {
    const multi = q.type==='multi';
    const sel = multi ? (val||[]) : val;
    body = `<div class="opts">${q.opts.map(o=>{
      const on = multi ? sel.includes(o.v) : sel===o.v;
      return `<button class="opt ${on?'on':''}" onclick="pick('${q.id}','${o.v}')">
        <span class="e">${o.e}</span><span class="t"><b>${o.t}</b>${o.s?`<small>${o.s}</small>`:''}</span></button>`;
    }).join('')}</div>`;
  }
  const showNext = q.type==='number' || q.type==='multi';
  $app.innerHTML = `
    <div class="prog"><div class="bar"><i style="width:${pct}%"></i></div><span class="lbl">${run.qi+1} / ${qs.length}</span></div>
    <span class="chap-tag">${ch.icon} 第 ${CHAPTERS.indexOf(ch)+1} 關｜${ch.name}</span>
    <h2 class="q">${q.q}</h2>
    ${q.sub?`<p class="q-sub">${q.sub}</p>`:'<div style="height:12px"></div>'}
    ${body}
    <div class="nav">
      <button class="btn btn-ol back" onclick="back()">←</button>
      ${showNext?`<button class="btn btn-gd" onclick="next()">${q.type==='multi'&&!(val||[]).length?'都沒有，下一步':'下一步'} →</button>`:''}
    </div>`;
  scrollTo(0,0);
}

function peopleNote(n){
  if(n>6) return `一位教練最多帶 6 人，${n} 人會分成 ${Math.ceil(n/6)} 組`;
  if(n===1) return '1 對 1，教練全程只看你一個';
  return `1 位教練對 ${n} 位學生，人越多平均越便宜`;
}
function step(d){
  const q = visibleQs(CHAPTERS[run.chapters[run.ci]])[run.qi];
  S.a[q.id] = Math.min(q.max, Math.max(q.min, (S.a[q.id]||q.def)+d));
  document.getElementById('num').textContent = S.a[q.id];
  document.getElementById('numNote').textContent = peopleNote(S.a[q.id]);
  save();
}

function pick(id, v){
  const ch = CHAPTERS[run.chapters[run.ci]];
  const q = ch.qs.find(x=>x.id===id);
  if(q.type==='multi'){
    const arr = S.a[id]||[];
    S.a[id] = arr.includes(v) ? arr.filter(x=>x!==v) : arr.concat(v);
    save(); question(); return;
  }
  S.a[id] = v; save();
  const o = q.opts.find(x=>x.v===v);
  // 先讓選項亮一下，再跳小知識或下一題
  question();
  setTimeout(()=>{ o.tip ? tip(o.tip) : next(); }, 260);
}

function tip(text){
  const w = document.createElement('div');
  w.className = 'tip-wrap';
  w.innerHTML = `<div class="tip"><div class="h">💡 小知識</div><div class="b">${text}</div>
    <button class="btn btn-gd">知道了，下一題 →</button></div>`;
  const close = ()=>{ w.remove(); next(); };
  w.querySelector('button').onclick = close;
  w.onclick = e=>{ if(e.target===w) close(); };
  document.body.appendChild(w);
}

function next(){ run.qi++; question(); }
function back(){
  if(run.qi>0){ run.qi--; question(); }
  else if(run.ci>0){ run.ci--; run.qi = visibleQs(CHAPTERS[run.chapters[run.ci]]).length-1; question(); }
  else home();
}

function chapterClear(ch){
  S.done[ch.id] = true; save();
  snowBurst();
  const last = run.ci >= run.chapters.length-1;
  const allDone = CHAPTERS.every(c=>S.done[c.id]);
  $app.innerHTML = `
    <div class="clear">
      <div class="badge">${ch.icon}</div>
      <h2>過關！獲得「${ch.badge}」</h2>
      <p>${CHAPTERS.filter(c=>S.done[c.id]).length} / 4 關完成</p>
      ${!last ? `<button class="btn btn-gd" onclick="run.ci++;run.qi=0;question()">下一關：${CHAPTERS[run.chapters[run.ci+1]].name} →</button>
                 <div class="gap"></div><button class="btn btn-ol" onclick="result()">先看清單</button>`
        : allDone ? `<button class="btn btn-gd" onclick="result()">看我的行前清單 ✨</button>`
        : `<button class="btn btn-gd" onclick="home()">回到地圖</button>
           <div class="gap"></div><button class="btn btn-ol" onclick="result()">先看目前的清單</button>`}
    </div>`;
  scrollTo(0,0);
}
function snowBurst(){
  for(let i=0;i<26;i++){
    const s = document.createElement('div');
    s.className='snow'; s.textContent = Math.random()<.5?'❄':'❅';
    s.style.left = Math.random()*100+'vw';
    s.style.fontSize = (12+Math.random()*16)+'px';
    s.style.animationDuration = (2.2+Math.random()*2.5)+'s';
    s.style.animationDelay = (Math.random()*.6)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 5500);
  }
}

function groups(n){

  return Array.from({length:k},(_,i)=>base+(i<extra?1:0));
}

function secPrice(r){
  const a = A();
  if(!S.done.level) return `<div class="sec"><h2>💰 預估費用</h2>${missing(3)}</div>`;
  const people = +a.people||1, ldays = +a.lessonDays||1, half = a.dayType==='half';
  const g = groups(people);
  const base = g.reduce((s,n)=>s+(half?HALF[n]:FULL[n]),0) * ldays;
  // 九折只限全天課，且雪場在藏王、岩原、中里、神立（還沒選地點就先以可折扣估算）
  const discOk = !r || resortPick(r).disc;
  const lesson = (!half && discOk) ? Math.round(base*0.9) : base;
  const lessonNote = half ? '半天一般沒有折扣'
    : discOk ? `加入 <a href="${GROUP_URL}" target="_blank" rel="noopener">LINE 社群</a>享全天課九折`
    : '神樂、苗場等雪場不適用九折（九折限藏王、岩原、中里、神立）';
  const tripDays = Math.max(ldays, +a.days||ldays);
  const have = a.have||[];
  // 雪具（日圓/人/天）：板＋鞋 ¥4,500、雪衣褲 ¥4,000、安全帽 ¥1,000
  let gearY = 0;
  if(!have.includes('board')) gearY += 4500;
  if(!have.includes('wear')) gearY += 4000;
  if(!have.includes('helmet')) gearY += 1000;
  const gear = Math.round(gearY*JPY/100)*100;
  // 雪票（日圓/天）
  const rp = r ? resortPick(r).n : '';
  const lift = rp.includes('Liza') ? 4500 : r==='zao' ? 8000 : 5500;
  const liftT = Math.round(lift*JPY/100)*100;
  const fmt = n=>'NT$ '+n.toLocaleString();
  const perPerson = Math.round(lesson/people);
  const showTour = r==='zao' && (a.days==='3'||a.days==='4') && a.stay!=='slope' && a.stay!=='city';
  return `<div class="sec"><h2>💰 預估費用</h2>
    <div class="disc">⚠️ 以下為「推薦方案」與「預估價格」，可能跟原本預期的不一樣。實際金額會依日期、人數、匯率與當期優惠調整，請以小編的正式報價為準。</div>
    <table class="price">
      <tr><td>教練課｜${g.map(n=>'1 對 '+n).join('＋')}・${half?'半天':'全天'} × ${ldays} 天
        <small>${lessonNote}｜整組總額，一人約 ${fmt(perPerson)}</small></td><td>${fmt(lesson)}</td></tr>
      <tr><td>雪具租借｜每人每天
        <small>${gear?'板＋鞋'+(have.includes('wear')?'':'＋雪衣褲')+(have.includes('helmet')?'':'＋安全帽')+'，依店家不同':'你的裝備都有了！'}</small></td><td>${gear?'約 '+fmt(gear):'—'}</td></tr>
      <tr><td>雪票｜每人每天
        <small>${r?rp+' 一日券參考價':'依雪場不同'}${isBeginner()?'｜新手第一天買回數券更省':''}</small></td><td>約 ${fmt(liftT)}</td></tr>
      <tr><td>住宿｜每晚
        <small>${r==='zao'?'藏王溫泉街偏貴；山形市區較便宜':'湯澤車站附近選擇最多'}</small></td><td>約 NT$ 3,000 起</td></tr>
      <tr class="total"><td>教練課＋雪具＋雪票<small>${people} 人・滑 ${tripDays} 天的粗估（不含住宿、交通、機票）</small></td>
        <td>約 ${fmt(lesson + (gear+liftT)*people*tripDays)}</td></tr>
    </table>
    ${showTour?`<div class="callout gd"><b>🧳 藏王一站式包團｜一人 ${fmt(TOUR)}</b><br>5 天 4 夜滑 3 天：含住宿、3 天教練課、3 天雪票、課程保險、車站接送與每天雪場接駁、每天泡溫泉。<br>${people} 人約 ${fmt(TOUR*people)}，滑 3 天以上又不想自己安排的話很划算！（不含雪具、餐費、機票）</div>`:''}
    <p style="font-size:12.5px;color:var(--mu)">日圓以 1 日圓 ≈ ${JPY} 台幣估算。訂金是一天 5,000，尾款上課前一個月左右支付，只接受轉帳。</p>
  </div>`;
}

  if(a.lessonDays) L.push('想上：'+(a.dayType==='half'?'半天':'全天')+' × '+a.lessonDays+' 天');
  const st = {station:'已訂車站附近',slope:'已訂雪場旁',city:'已訂市區',none:'還沒訂住宿'}[a.stay];
  if(st) L.push('住宿：'+st);
  return L;
}

function secContact(r){
  const L = summary();
  const msg = '你好！我用了「滑雪行前小幫手」，想詢問課程空檔～\n'+L.map(x=>'・'+x).join('\n')+'\n日期：（請填）';
  const lineUrl = 'https://line.me/R/oaMessage/'+encodeURIComponent(LINE_ID)+'/?'+encodeURIComponent(msg);
  window._msg = msg;
  return `<div class="sec" style="text-align:center"><h2 style="justify-content:center">💬 下一步</h2>
    <div class="disc" style="text-align:left">📌 以上為參考用結果。如有任何問題及疑慮，可以直接詢問客服，真人小編會依照您的情況回覆！</div>
    <p style="margin-bottom:14px">教練名額要依日期確認，<br>把你的答案和日期傳給小編，<br>幫你查教練空檔、算正式報價！</p>
    <a class="btn btn-ln" href="${lineUrl}" target="_blank" rel="noopener">用 LINE 傳給小編</a>
    <div class="gap"></div>
    <a class="btn btn-ol" href="${GROUP_URL}" target="_blank" rel="noopener">🎁 加入 LINE 社群，全天課享九折</a>
    <p class="note" style="margin-top:6px">九折限藏王、岩原、中里、神立的全天課</p>
    <div class="gap"></div>
    <button class="btn btn-ol" onclick="copyMsg()">複製我的答案</button>
    <p class="note">LINE 官方帳號 ${LINE_ID}<br>小編確認日期有教練後，會再傳報名表單給你</p>
  </div>`;
}

function copyMsg(){
  const done = ()=>toast('已複製！貼到 LINE 給小編就可以了');
  if(navigator.clipboard) navigator.clipboard.writeText(window._msg).then(done, ()=>fallback());
  else fallback();
  function fallback(){ const t=document.createElement('textarea'); t.value=window._msg; document.body.appendChild(t); t.select(); try{document.execCommand('copy');done();}catch(e){} t.remove(); }
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

function bindChecks(){
  document.querySelectorAll('.chk input').forEach(cb=>{
    cb.onchange = ()=>{ S.checks[cb.dataset.k]=cb.checked; cb.closest('li').classList.toggle('done',cb.checked); save(); };
  });
}

function reset(){
  if(!confirm('要清除所有答案，重新開始嗎？')) return;
  S = {a:{}, done:{}, checks:{}}; save(); home();
}

home();
</script>
